name: Zaynix iOS Builder
on: [workflow_dispatch]
jobs:
  ios-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter create --platforms=ios .
      - run: flutter pub get
      - run: flutter build ipa --no-codesign
      - name: Packaging iOS Payload
        run: |
          mkdir -p Payload
          cp -r build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app Payload/
          zip -r ZaynixFiles.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Zaynix-iOS-IPA
          path: ZaynixFiles.ipa
          
